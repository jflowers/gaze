---
# Reusable Gaze AI Report
# =======================
# Provider-agnostic workflow that runs `gaze report --ai=opencode`
# against the calling repository and enforces CRAP thresholds.
#
# Contract:
# - The caller uploads a coverprofile artifact in a prior job and
#   passes its name via `coverage-artifact`.
# - The entire opencode configuration — provider, model,
#   permissions, and literal API key — arrives via the
#   `opencode-config` secret (strict JSON) and is exported
#   verbatim as OPENCODE_CONFIG_CONTENT. The consumer controls
#   the whole configuration; this workflow dictates no provider
#   specifics. Permission denials (edit/bash/webfetch/websearch)
#   are recommended since the config carries key material.
# - When `opencode-config` is unavailable (e.g. fork PRs), the
#   install and report steps are skipped with a notice so the
#   wiring still validates without secrets.
name: Reusable Gaze AI Report

on:
  workflow_call:
    inputs:
      model:
        description: "Optional model override; when unset, opencode uses the config's top-level model."
        required: false
        type: string
      coverage-artifact:
        description: "Artifact name in the calling run that contains the coverprofile."
        required: true
        type: string
      coverprofile:
        description: "Coverprofile path inside the checked-out repository."
        required: false
        default: "coverage.out"
        type: string
      max-crapload:
        description: "Fail when the CRAPload exceeds this value."
        required: false
        type: number
      max-gaze-crapload:
        description: "Fail when the GazeCRAPload exceeds this value."
        required: false
        type: number
      min-contract-coverage:
        description: "Fail when average contract coverage falls below this percentage."
        required: false
        type: number
      opencode-version:
        description: "opencode-ai npm version to install."
        required: false
        default: "1.19.0"
        type: string
      gaze-version:
        description: "gaze release tag to install."
        required: false
        default: "v2.2.0"
        type: string
      go-version:
        description: "Go toolchain version for setup-go."
        required: false
        default: "1.25"
        type: string
    secrets:
      opencode-config:
        description: "Full strict-JSON opencode config (provider, model, permissions, literal API key); exported verbatim as OPENCODE_CONFIG_CONTENT."
        required: false

permissions:
  contents: read

jobs:
  gaze-ai-report:
    name: Gaze AI Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HAS_OPENCODE_CONFIG: ${{ secrets.opencode-config != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.coverage-artifact }}
          path: .

      - name: Install gaze
        env:
          GAZE_RELEASE: ${{ inputs.gaze-version }}
        run: go install github.com/unbound-force/gaze/v2/cmd/gaze@"$GAZE_RELEASE"

      - name: Install OpenCode
        if: env.HAS_OPENCODE_CONFIG == 'true'
        env:
          OPENCODE_RELEASE: ${{ inputs.opencode-version }}
        run: npm install -g opencode-ai@"$OPENCODE_RELEASE"

      - name: Run gaze AI report
        if: env.HAS_OPENCODE_CONFIG == 'true'
        env:
          OPENCODE_CONFIG_CONTENT: ${{ secrets.opencode-config }}
          GAZE_MODEL: ${{ inputs.model }}
          COVERPROFILE: ${{ inputs.coverprofile }}
          MAX_CRAPLOAD: ${{ inputs.max-crapload }}
          MAX_GAZE_CRAPLOAD: ${{ inputs.max-gaze-crapload }}
          MIN_CONTRACT_COVERAGE: ${{ inputs.min-contract-coverage }}
        run: |
          unset GITHUB_TOKEN GH_TOKEN
          MODEL_ARG=""
          if [ -n "$GAZE_MODEL" ]; then
            MODEL_ARG="--model=$GAZE_MODEL"
          fi
          THRESHOLDS=""
          if [ -n "$MAX_CRAPLOAD" ]; then
            THRESHOLDS="$THRESHOLDS --max-crapload=$MAX_CRAPLOAD"
          fi
          if [ -n "$MAX_GAZE_CRAPLOAD" ]; then
            THRESHOLDS="$THRESHOLDS --max-gaze-crapload=$MAX_GAZE_CRAPLOAD"
          fi
          if [ -n "$MIN_CONTRACT_COVERAGE" ]; then
            THRESHOLDS="$THRESHOLDS --min-contract-coverage=$MIN_CONTRACT_COVERAGE"
          fi
          gaze report ./... \
            --ai=opencode \
            $MODEL_ARG \
            --coverprofile="$COVERPROFILE" \
            $THRESHOLDS

      - name: Report skipped
        if: env.HAS_OPENCODE_CONFIG != 'true'
        run: |
          echo "Skipping the gaze AI report: no opencode config secret available (secrets are unavailable on fork PRs)." | tee -a "$GITHUB_STEP_SUMMARY"
